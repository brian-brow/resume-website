[package]
name = "pond"
version = "0.1.0"
edition = "2021"
description = "Dithered water + boids simulation for brianbrown.dev, compiled to WebAssembly"

[lib]
# cdylib -> the .wasm module; rlib -> lets `cargo test` run natively
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"

[profile.release]
opt-level = 3
lto = true
