<!doctype html>
<meta charset="utf-8" />
<title>Caustics prototype</title>
<style>
  html, body { margin: 0; height: 100%; background: #394053; overflow: hidden; }
  canvas { width: 100vw; height: 100vh; image-rendering: pixelated; display: block; }
  #ui { position: fixed; top: 8px; left: 8px; background: #000a; color: #dbfe87; font: 12px monospace; padding: 8px; display: grid; grid-template-columns: auto 160px 48px; gap: 4px 8px; align-items: center; }
</style>
<canvas id="c"></canvas>
<div id="ui"></div>
<script>
const DOT = 3;
const params = { scale: [0.02, 0.005, 0.06, 0.001], gain: [0.25, 0.02, 1.5, 0.01], speed: [0.75, 0, 3, 0.01], warp: [0.07, 0, 0.3, 0.005] };
const ui = document.getElementById("ui");
const val = {};
for (const [k, [v, lo, hi, st]] of Object.entries(params)) {
  val[k] = v;
  const label = document.createElement("span"); label.textContent = k;
  const input = Object.assign(document.createElement("input"), { type: "range", min: lo, max: hi, step: st, value: v });
  const out = document.createElement("span"); out.textContent = v;
  input.oninput = () => { val[k] = +input.value; out.textContent = input.value; };
  ui.append(label, input, out);
}

const canvas = document.getElementById("c");
const gl = canvas.getContext("webgl2");

const vs = `#version 300 es
in vec2 p; void main() { gl_Position = vec4(p, 0., 1.); }`;

const fs = `#version 300 es
precision highp float;
uniform float uT, uScale, uGain, uWarp;
out vec4 o;

// webgl-noise 3D simplex with analytic gradient (Gustavson, MIT)
vec3 mod289(vec3 x) { return x - floor(x * (1. / 289.)) * 289.; }
vec4 mod289(vec4 x) { return x - floor(x * (1. / 289.)) * 289.; }
vec4 permute(vec4 x) { return mod289(((x * 34.) + 10.) * x); }
vec4 taylorInvSqrt(vec4 r) { return 1.79284291400159 - 0.85373472095314 * r; }
vec4 snoise(vec3 v) {
  const vec2 C = vec2(1. / 6., 1. / 3.);
  const vec4 D = vec4(0., .5, 1., 2.);
  vec3 i = floor(v + dot(v, C.yyy));
  vec3 x0 = v - i + dot(i, C.xxx);
  vec3 g = step(x0.yzx, x0.xyz);
  vec3 l = 1. - g;
  vec3 i1 = min(g.xyz, l.zxy);
  vec3 i2 = max(g.xyz, l.zxy);
  vec3 x1 = x0 - i1 + C.xxx;
  vec3 x2 = x0 - i2 + C.yyy;
  vec3 x3 = x0 - D.yyy;
  i = mod289(i);
  vec4 p = permute(permute(permute(i.z + vec4(0., i1.z, i2.z, 1.)) + i.y + vec4(0., i1.y, i2.y, 1.)) + i.x + vec4(0., i1.x, i2.x, 1.));
  vec3 ns = 0.142857142857 * D.wyz - D.xzx;
  vec4 j = p - 49. * floor(p * ns.z * ns.z);
  vec4 x_ = floor(j * ns.z);
  vec4 y_ = floor(j - 7. * x_);
  vec4 x = x_ * ns.x + ns.yyyy;
  vec4 y = y_ * ns.x + ns.yyyy;
  vec4 h = 1. - abs(x) - abs(y);
  vec4 b0 = vec4(x.xy, y.xy);
  vec4 b1 = vec4(x.zw, y.zw);
  vec4 s0 = floor(b0) * 2. + 1.;
  vec4 s1 = floor(b1) * 2. + 1.;
  vec4 sh = -step(h, vec4(0.));
  vec4 a0 = b0.xzyw + s0.xzyw * sh.xxyy;
  vec4 a1 = b1.xzyw + s1.xzyw * sh.zzww;
  vec3 p0 = vec3(a0.xy, h.x);
  vec3 p1 = vec3(a0.zw, h.y);
  vec3 p2 = vec3(a1.xy, h.z);
  vec3 p3 = vec3(a1.zw, h.w);
  vec4 norm = taylorInvSqrt(vec4(dot(p0, p0), dot(p1, p1), dot(p2, p2), dot(p3, p3)));
  p0 *= norm.x; p1 *= norm.y; p2 *= norm.z; p3 *= norm.w;
  vec4 m = max(.5 - vec4(dot(x0, x0), dot(x1, x1), dot(x2, x2), dot(x3, x3)), 0.);
  vec4 m2 = m * m;
  vec4 m4 = m2 * m2;
  vec4 pdotx = vec4(dot(p0, x0), dot(p1, x1), dot(p2, x2), dot(p3, x3));
  vec4 temp = m2 * m * pdotx;
  vec3 grad = -8. * (temp.x * x0 + temp.y * x1 + temp.z * x2 + temp.w * x3);
  grad += m4.x * p0 + m4.y * p1 + m4.z * p2 + m4.w * p3;
  return 105. * vec4(grad, dot(m4, pdotx));
}

float caustics(vec3 pos) {
  vec4 n = snoise(pos);
  pos -= uWarp * n.xyz;
  pos *= 1.62;
  n = snoise(pos);
  pos -= uWarp * n.xyz;
  n = snoise(pos);
  pos -= uWarp * n.xyz;
  return snoise(pos).w;
}

const float BAYER[64] = float[64](0.,32.,8.,40.,2.,34.,10.,42.,48.,16.,56.,24.,50.,18.,58.,26.,12.,44.,4.,36.,14.,46.,6.,38.,60.,28.,52.,20.,62.,30.,54.,22.,3.,35.,11.,43.,1.,33.,9.,41.,51.,19.,59.,27.,49.,17.,57.,25.,15.,47.,7.,39.,13.,45.,5.,37.,63.,31.,55.,23.,61.,29.,53.,21.);

void main() {
  ivec2 d = ivec2(gl_FragCoord.xy);
  vec3 pos = vec3(gl_FragCoord.x * uScale, uT, gl_FragCoord.y * uScale);
  float w = mix(caustics(pos), caustics(pos + 1.), .5);
  float tone = uGain * exp(w * 4. - 1.);
  float th = (BAYER[(d.y & 7) * 8 + (d.x & 7)] + .5) / 64.;
  o = tone > th ? vec4(0.859, 0.996, 0.529, 1.) : vec4(0.224, 0.251, 0.325, 1.);
}`;

function shader(type, src) {
  const s = gl.createShader(type);
  gl.shaderSource(s, src);
  gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
  return s;
}
const prog = gl.createProgram();
gl.attachShader(prog, shader(gl.VERTEX_SHADER, vs));
gl.attachShader(prog, shader(gl.FRAGMENT_SHADER, fs));
gl.linkProgram(prog);
gl.useProgram(prog);
gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
gl.enableVertexAttribArray(0);
gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
const u = Object.fromEntries(["uT", "uScale", "uGain", "uWarp"].map((n) => [n, gl.getUniformLocation(prog, n)]));

function resize() {
  canvas.width = Math.ceil(innerWidth / DOT);
  canvas.height = Math.ceil(innerHeight / DOT);
  gl.viewport(0, 0, canvas.width, canvas.height);
}
addEventListener("resize", resize);
resize();

let t = 0, last = performance.now();
requestAnimationFrame(function frame(now) {
  t += ((now - last) / 1000) * val.speed * 0.4;
  last = now;
  gl.uniform1f(u.uT, t);
  gl.uniform1f(u.uScale, val.scale);
  gl.uniform1f(u.uGain, val.gain);
  gl.uniform1f(u.uWarp, val.warp);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
  requestAnimationFrame(frame);
});
</script>
